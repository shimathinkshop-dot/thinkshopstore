<title>Thinkshop | فروشگاه بازی‌های فکری</title><style>
:root{
 --bg:#151026;--bg2:#1c1230;--panel:#24153a;--panel2:#2e1a47;
 --pink:#ff76b6;--pink2:#ff9bcb;--purple:#8d49df;--purple2:#b46df1;
 --navy:#11132c;--text:#fff7fc;--muted:#c7b8d0;--line:rgba(255,255,255,.11);
 --shadow:0 24px 65px rgba(3,1,12,.38);--radius:24px;
}
*{box-sizing:border-box;scroll-behavior:smooth}
body{margin:0;background:
 radial-gradient(circle at 80% 0%,rgba(141,73,223,.22),transparent 28%),
 radial-gradient(circle at 0% 30%,rgba(255,118,182,.11),transparent 28%),
 linear-gradient(180deg,#21122d 0%,#2b1639 55%,#1d1028 100%);
 color:var(--text);font-family:Tahoma,"Vazirmatn",Arial,sans-serif;line-height:1.8}
a{text-decoration:none;color:inherit} button,input{font:inherit}
.container{width:min(1120px,92%);margin:auto}
.top-strip{background:linear-gradient(90deg,#6b2db4,#922c91,#5e2bb1);font-size:.8rem}
.top-strip .inner{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.top-info{display:flex;gap:25px;flex-wrap:wrap;color:#fff}
.header{position:sticky;top:0;z-index:1000;background:rgba(18,12,32,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{font-size:1.8rem;font-weight:900;letter-spacing:-1px}
.brand span{color:var(--pink)}
.navlinks{display:flex;gap:5px;align-items:center}
.navlinks a{padding:9px 13px;border-radius:14px;color:#eee4f2;font-size:.9rem}
.navlinks a:hover,.navlinks a.active{color:var(--pink2);background:rgba(255,118,182,.08)}
.header-actions{display:flex;align-items:center;gap:8px}
.cart-btn,.menu-btn{border:0;cursor:pointer;color:#fff}
.cart-btn{padding:11px 18px;border-radius:17px;background:linear-gradient(135deg,var(--pink2),var(--pink));color:#28142a;font-weight:900}
.menu-btn{display:none;width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--pink),var(--purple2));font-size:25px}
.mobile-nav{display:none}

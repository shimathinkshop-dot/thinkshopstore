<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت ThinkShop</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f4f7;color:#2b2430;font-family:Tahoma,Arial,sans-serif}.wrap{width:min(1250px,calc(100% - 28px));margin:auto}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:24px 0}.brand{font-size:24px;font-weight:1000}.brand span{color:#e979aa}.small,.sub,.meta{color:#817786;font-size:12px;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:11px 16px;font-weight:900;cursor:pointer}.primary{background:#e979aa;color:#fff}.dark{background:#302735;color:#fff}.danger{background:#e85f72;color:#fff}.card{background:#fff;border:1px solid #eee4eb;border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(43,36,48,.06)}.login{max-width:430px;margin:12vh auto}.title{font-size:22px;font-weight:1000;margin-bottom:8px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;color:#817786;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #e8dfe6;border-radius:12px;padding:12px;background:#fff;outline:0}.field textarea{min-height:120px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.checks{display:flex;gap:18px;flex-wrap:wrap}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid #eee4eb;border-radius:18px;padding:17px}.stat b{display:block;font-size:24px;margin-top:5px}.products{display:grid;gap:10px}.row{display:grid;grid-template-columns:70px 1fr auto;gap:13px;align-items:center;background:#fff;border:1px solid #eee4eb;border-radius:16px;padding:10px}.thumb{width:70px;height:70px;border-radius:12px;overflow:hidden;background:#f7eff4;display:flex;align-items:center;justify-content:center}.thumb img{width:100%;height:100%;object-fit:cover}.pname{font-weight:900;margin-bottom:5px}.actions{display:flex;gap:7px;flex-wrap:wrap}.message{padding:11px 13px;border-radius:11px;margin:12px 0;display:none}.message.show{display:block}.ok{background:#eaf8f1;color:#14794f}.err{background:#fff0f2;color:#b62f43}.modal{position:fixed;inset:0;background:rgba(20,12,25,.58);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto}.smallcaps{font-size:11px;color:#a56a86}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.row{grid-template-columns:58px 1fr}.row .actions{grid-column:1/-1}.thumb{width:58px;height:58px}}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="loginView" class="wrap"><div class="card login"><div class="title">🔐 مدیریت <span style="color:#e979aa">ThinkShop</span></div><div class="sub">مدیریت فروشگاه، محصولات، موجودی و اطلاعات عمومی.</div><div id="loginMsg" class="message"></div><form id="loginForm"><div class="field"><label>رمز مدیریت</label><input id="password" type="password" autocomplete="current-password" required autofocus></div><button class="btn primary" style="width:100%">ورود به پنل</button></form></div></div><div id="app" class="wrap hidden"><div class="top"><div><div class="brand">Think<span>Shop</span> Admin</div><div class="small">مرکز مدیریت فروشگاه</div></div><div class="actions"><a class="btn dark" href="/">مشاهده فروشگاه</a><button id="logoutBtn" class="btn danger">خروج</button></div></div><div id="msg" class="message"></div><div class="stats"><div class="stat"><span class="smallcaps">تعداد محصولات</span><b id="statProducts">۰</b></div><div class="stat"><span class="smallcaps">موجود</span><b id="statStock">۰</b></div><div class="stat"><span class="smallcaps">منتخب</span><b id="statFeatured">۰</b></div><div class="stat"><span class="smallcaps">پرفروش</span><b id="statBest">۰</b></div></div><div class="card" style="margin-bottom:16px"><div class="toolbar"><div><strong>محصولات</strong><div class="small">افزودن، ویرایش، حذف و کنترل موجودی محصولات</div></div><button id="newBtn" class="btn primary">＋ افزودن محصول</button></div><div style="margin-bottom:14px"><input id="adminSearch" placeholder="جستجوی محصول..." style="width:100%;border:1px solid #e8dfe6;border-radius:12px;padding:12px"></div><div id="products" class="products"></div></div><div class="card"><div class="toolbar"><div><strong>اطلاعات فروشگاه</strong><div class="small">این اطلاعات مستقیماً روی سایت استفاده می‌شوند.</div></div><button id="saveInfoBtn" class="btn primary">ذخیره اطلاعات</button></div><div id="infoMsg" class="message"></div><div class="grid"><div class="field"><label>درباره ما</label><textarea id="aboutInfo"></textarea></div><div class="field"><label>متن تماس با ما</label><textarea id="contactInfo"></textarea></div><div class="field"><label>شماره تماس</label><input id="phoneInfo" type="tel"></div><div class="field"><label>ایمیل</label><input id="emailInfo" type="email"></div><div class="field"><label>واتساپ</label><input id="whatsappInfo" type="url"></div><div class="field"><label>اینستاگرام</label><input id="instagramInfo" type="url"></div><div class="field"><label>آدرس</label><textarea id="addressInfo"></textarea></div><div class="field"><label>قوانین خرید</label><textarea id="termsInfo"></textarea></div><div class="field"><label>حریم خصوصی</label><textarea id="privacyInfo"></textarea></div></div></div></div><div id="modal" class="modal"><div class="modalbox card"><div class="toolbar"><strong id="modalTitle">افزودن محصول</strong><button id="closeBtn" class="btn dark">بستن</button></div><div id="formMsg" class="message"></div><form id="productForm"><input type="hidden" id="pid"><div class="grid"><div class="field"><label>نام محصول *</label><input id="name" required></div><div class="field"><label>قیمت به تومان *</label><input id="price" type="number" min="0" required></div><div class="field"><label>موجودی واقعی *</label><input id="stock" type="number" min="0" step="1" value="0" required></div><div class="field"><label>نوع نمایش</label><select id="type"><option value="منتخب">منتخب Thinkshop</option><option value="پرفروش">پرفروش‌ها</option><option value="فروشگاه">فروشگاه</option></select></div><div class="field"><label>عنوان روی تصویر</label><input id="cover" placeholder="ThinkShop"></div></div><div class="field"><label>عکس محصول</label><input id="image" type="url" placeholder="https://..."><input id="imageFile" type="file" accept="image/*" style="margin-top:8px"><div id="imagePreview" style="display:none;margin-top:10px"><img id="imagePreviewImg" alt="پیش‌نمایش" style="width:120px;height:120px;object-fit:cover;border-radius:14px"></div></div><div class="field"><label>توضیحات محصول</label><textarea id="desc"></textarea></div><div class="grid"><div class="field"><label>امتیاز</label><input id="rating" value="۵.۰"></div><div class="field"><label>تعداد نظرات</label><input id="reviews" value="۰"></div></div><div class="checks"><label><input id="featured" type="checkbox"> محصول منتخب</label><label><input id="best" type="checkbox"> پرفروش</label></div><div style="display:flex;gap:8px;margin-top:18px"><button class="btn primary" type="submit">ذخیره محصول</button><button id="cancelBtn" type="button" class="btn dark">انصراف</button></div></form></div></div><script>
const $=s=>document.querySelector(s);
let products=[];
function msg(el,text,ok=false){el.textContent=text;el.className='message show '+(ok?'ok':'err')}
function clearMsg(el){el.className='message';el.textContent=''}
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let d={};try{d=await r.json()}catch{};if(!r.ok||d.ok===false)throw new Error(d.error||'خطای سرور');return d}
async function checkAuth(){try{await api('/api/admin/me');showApp();await Promise.all([load(),loadSiteInfo()])}catch{showLogin()}}
function showLogin(){$('#loginView').classList.remove('hidden');$('#app').classList.add('hidden')}
function showApp(){$('#loginView').classList.add('hidden');$('#app').classList.remove('hidden')}
function fa(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function money(n){return fa(Number(n).toLocaleString('en-US'))+' تومان'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function load(){const d=await api('/api/products');products=d.products||[];renderProducts()}
function renderProducts(){
 $('#products').innerHTML=products.length?products.map(p=>`<div class="row"><div class="thumb">${p.image?`<img src="${esc(p.image)}" onerror="this.style.display='none'">`:'🎲'}</div><div><div class="pname">${esc(p.name)}</div><div class="meta">${money(p.price)} · موجودی: <b>${fa(p.stock||0)}</b> · ${esc(p.type||'فروشگاه')} · ${p.featured?'منتخب ':''}${p.best?'پرفروش':''}</div></div><div class="actions"><button class="btn dark" onclick="editProduct(${p.id})">ویرایش</button><button class="btn danger" onclick="deleteProduct(${p.id})">حذف</button></div></div>`).join(''):'<div class="sub" style="margin:0">محصولی وجود ندارد.</div>';
}
function openForm(p=null){
 clearMsg($('#formMsg'));$('#modal').classList.add('show');$('#modalTitle').textContent=p?'ویرایش محصول':'افزودن محصول';
  $('#pid').value=p?.id||'';$('#name').value=p?.name||'';$('#price').value=p?.price??'';$('#stock').value=Number.isFinite(Number(p?.stock))?Number(p.stock):0;$('#type').value=p?.type||'منتخب';$('#cover').value=p?.cover||'ThinkShop';$('#image').value=p?.image||'';$('#imageFile').value='';$('#imagePreview').style.display=p?.image?'block':'none';$('#imagePreviewImg').src=p?.image||'';$('#desc').value=p?.desc||'';$('#rating').value=p?.rating||'۵.۰';$('#reviews').value=p?.reviews||'۰';$('#featured').checked=!!(p?.featured||(p?.type==='منتخب'));$('#best').checked=!!(p?.best||(p?.type==='پرفروش'));setTimeout(()=>$('#name').focus(),50)
}
window.editProduct=id=>openForm(products.find(p=>Number(p.id)===Number(id)));
window.deleteProduct=async id=>{const p=products.find(x=>Number(x.id)===Number(id));if(!p)return;if(!confirm('محصول «'+p.name+'» حذف شود؟'))return;try{await api('/api/products?id='+encodeURIComponent(id),{method:'DELETE'});msg($('#msg'),'محصول حذف شد.',true);await load()}catch(e){msg($('#msg'),e.message)}};
$('#newBtn').onclick=()=>openForm();$('#closeBtn').onclick=$('#cancelBtn').onclick=()=>$('#modal').classList.remove('show');
async function fileToOptimizedDataUrl(file){
  if(!file)return '';
  if(!file.type.startsWith('image/'))throw new Error('لطفاً یک فایل تصویری انتخاب کن.');
  if(file.size>8*1024*1024)throw new Error('حجم عکس بیشتر از ۸ مگابایت است.');
  const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('خواندن عکس ناموفق بود.'));r.readAsDataURL(file)});
  const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('باز کردن عکس ناموفق بود.'));im.src=raw});
  const maxSide=900,scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
  const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale)),h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  for(const q of [0.78,0.68,0.58,0.48]){const data=c.toDataURL('image/webp',q);if(data.length<=500000)return data}
  const jpeg=c.toDataURL('image/jpeg',0.45);if(jpeg.length<=500000)return jpeg;
  throw new Error('این عکس بعد از فشرده‌سازی هنوز بزرگ است؛ یک عکس کوچک‌تر انتخاب کن.');
}
$('#imageFile').addEventListener('change',()=>{const file=$('#imageFile').files?.[0];if(!file){$('#imagePreview').style.display=$('#image').value?'block':'none';return}const url=URL.createObjectURL(file);$('#imagePreviewImg').src=url;$('#imagePreview').style.display='block'});
$('#productForm').onsubmit=async e=>{e.preventDefault();clearMsg($('#formMsg'));const id=$('#pid').value;try{let image=$('#image').value.trim();const selectedFile=$('#imageFile').files?.[0];if(selectedFile){msg($('#formMsg'),'در حال آماده‌سازی عکس...',true);image=await fileToOptimizedDataUrl(selectedFile)}const p={name:$('#name').value.trim(),price:Number($('#price').value),stock:Number($('#stock').value),type:$('#type').value,cover:$('#cover').value.trim()||'ThinkShop',image,desc:$('#desc').value.trim(),rating:$('#rating').value.trim()||'۵.۰',reviews:$('#reviews').value.trim()||'۰',featured:$('#featured').checked,best:$('#best').checked};if(!p.name||!Number.isFinite(p.price)||p.price<0||!Number.isInteger(p.stock)||p.stock<0)throw new Error('نام، قیمت و موجودی را درست وارد کن.');await api('/api/products',{method:id?'PUT':'POST',body:JSON.stringify(id?{...p,id:Number(id)}:p)});$('#modal').classList.remove('show');msg($('#msg'),id?'محصول ویرایش شد.':'محصول با موفقیت ثبت شد.',true);await load()}catch(e){msg($('#formMsg'),e.message)}};
async function loadSiteInfo(){
  try{const d=await api('/api/site-info');const i=d.info||{};$('#aboutInfo').value=i.about||'';$('#contactInfo').value=i.contact||'';$('#phoneInfo').value=i.phone||'';$('#emailInfo').value=i.email||'';$('#whatsappInfo').value=i.whatsapp||'';$('#instagramInfo').value=i.instagram||'';$('#addressInfo').value=i.address||'';$('#termsInfo').value=i.terms||'';$('#privacyInfo').value=i.privacy||'';}catch(e){msg($('#infoMsg'),e.message)}
}
$('#saveInfoBtn').onclick=async()=>{try{await api('/api/site-info',{method:'PUT',body:JSON.stringify({about:$('#aboutInfo').value,contact:$('#contactInfo').value,phone:$('#phoneInfo').value,email:$('#emailInfo').value,whatsapp:$('#whatsappInfo').value,instagram:$('#instagramInfo').value,address:$('#addressInfo').value,terms:$('#termsInfo').value,privacy:$('#privacyInfo').value})});msg($('#infoMsg'),'اطلاعات فروشگاه با موفقیت ذخیره شد.',true)}catch(e){msg($('#infoMsg'),e.message)}};

$('#loginForm').onsubmit=async e=>{e.preventDefault();clearMsg($('#loginMsg'));try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});$('#password').value='';showApp();await load()}catch(e){msg($('#loginMsg'),e.message)}};
$('#logoutBtn').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST'})}catch{}showLogin()};
document.getElementById('adminSearch')?.addEventListener('input',renderProducts);
function switchTab(id){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));if(id==='ordersPanel')loadOrders();if(id==='inventoryPanel')loadInventory()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
async function loadOrders(){try{const d=await api('/api/admin/orders');const orders=d.orders||[];$('#statOrders').textContent=fa(orders.length);$('#ordersList').innerHTML=orders.length?orders.map(o=>`<div class="orderrow"><div><b>سفارش ${esc(o.order_number)}</b><div class="small">${esc(o.customer_name||'')} ${esc(o.customer_phone||'')}</div></div><div>${money(o.total)}<div class="small">${esc(o.created_at||'')}</div></div><div><span class="badge">${esc(o.payment_status||'unpaid')}</span><select onchange="setOrderStatus(${Number(o.id)},this.value)" style="margin-right:7px;background:#160d24;color:#fff;border:1px solid var(--line);border-radius:9px;padding:7px"><option value="pending" ${o.status==='pending'?'selected':''}>در انتظار</option><option value="confirmed" ${o.status==='confirmed'?'selected':''}>تأیید</option><option value="processing" ${o.status==='processing'?'selected':''}>در حال آماده‌سازی</option><option value="shipped" ${o.status==='shipped'?'selected':''}>ارسال شد</option><option value="delivered" ${o.status==='delivered'?'selected':''}>تحویل شد</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>لغو</option></select></div><div class="small">#${fa(o.id)}</div></div>`).join(''):'<div class="sub" style="margin:0">هنوز سفارشی ثبت نشده است.</div>'}catch(e){msg($('#msg'),e.message)}}
window.setOrderStatus=async(id,status)=>{try{await api('/api/admin/orders/'+id,{method:'PUT',body:JSON.stringify({status,note:'تغییر وضعیت توسط مدیریت'})});msg($('#msg'),'وضعیت سفارش تغییر کرد.',true);await loadOrders()}catch(e){msg($('#msg'),e.message)}};
async function loadInventory(){try{const d=await api('/api/admin/inventory');const rows=d.inventory||[];$('#statStock').textContent=fa(rows.reduce((a,x)=>a+Number(x.stock||0),0));$('#inventoryList').innerHTML=rows.map(x=>`<div class="inventoryrow"><div><b>${esc(x.name)}</b><div class="small">رزرو: ${fa(x.reserved||0)}</div></div><input id="stock-${x.id}" type="number" min="0" value="${Number(x.stock||0)}"><button class="btn primary" onclick="saveInventory(${Number(x.id)})">ذخیره</button><span class="small">موجودی واقعی</span></div>`).join('')||'<div class="sub">محصولی وجود ندارد.</div>'}catch(e){msg($('#msg'),e.message)}}
window.saveInventory=async(id)=>{try{const v=Number($('#stock-'+id).value);if(!Number.isInteger(v)||v<0)throw Error('موجودی نامعتبر است.');await api('/api/admin/inventory',{method:'PUT',body:JSON.stringify({product_id:id,stock:v})});msg($('#msg'),'موجودی ذخیره شد.',true);await loadInventory();await load()}catch(e){msg($('#msg'),e.message)}};
$('#refreshOrdersBtn').onclick=loadOrders;$('#refreshInventoryBtn').onclick=loadInventory;
const oldLoad=load;load=async function(){await oldLoad();$('#statProducts').textContent=fa(products.length);$('#statBest').textContent=fa(products.filter(x=>x.best).length);$('#statStock').textContent=fa(products.reduce((a,x)=>a+Number(x.stock||0),0));};
checkAuth();
</script></body></html>
